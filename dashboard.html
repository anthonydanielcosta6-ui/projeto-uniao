<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel Escolar</title>
</head>
<body>

<h1>Sistema Escolar</h1>

<h2>Cadastrar Aluno</h2>

<input id="nome" placeholder="Nome">

<input id="nascimento" type="date">

<input id="turma" placeholder="Turma">

<button onclick="cadastrarAluno()">
Salvar
</button>

<hr>

<button onclick="listarAlunos()">
Listar Alunos
</button>

<div id="resultado"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyqaEihJEYjEcdAs0_Rvxa5tJwDhm3NdeJ6goDvmbdR-ny6UaurPk03M8jSFfb8_JXP7A/exec";

async function cadastrarAluno(){

const nome =
document.getElementById("nome").value;

const nascimento =
document.getElementById("nascimento").value;

const turma =
document.getElementById("turma").value;

await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

acao:"cadastrarAluno",
nome,
nascimento,
turma

})

});

alert("Aluno cadastrado");

}

async function listarAlunos(){

const resposta = await fetch(API_URL,{

method:"POST",

body:JSON.stringify({
acao:"listarAlunos"
})

});

const dados = await resposta.json();

let html = "<table border='1'>";

dados.alunos.forEach(linha=>{

html += "<tr>";

linha.forEach(coluna=>{

html += `<td>${coluna}</td>`;

});

html += "</tr>";

});

html += "</table>";

document.getElementById("resultado").innerHTML =
html;

}

</script>

</body>
</html>
