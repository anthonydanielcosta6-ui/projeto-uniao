<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Sistema Escola</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
max-width:500px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input{
width:100%;
padding:10px;
margin:5px 0;
}

button{
width:100%;
padding:10px;
cursor:pointer;
}

</style>

</head>
<body>

<div class="card">

<h2>Login</h2>

<input id="usuario" placeholder="Usuário">

<input
id="senha"
type="password"
placeholder="Senha">

<button onclick="login()">
Entrar
</button>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyqaEihJEYjEcdAs0_Rvxa5tJwDhm3NdeJ6goDvmbdR-ny6UaurPk03M8jSFfb8_JXP7A/exec";

async function login(){

const usuario =
document.getElementById("usuario").value;

const senha =
document.getElementById("senha").value;

const resposta = await fetch(API_URL,{

method:"POST",

body:JSON.stringify({
acao:"login",
usuario,
senha
})

});

const dados = await resposta.json();

if(dados.sucesso){

localStorage.setItem(
"usuario",
JSON.stringify(dados)
);

window.location="dashboard.html";

}else{

alert("Login inválido");

}

}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Painel Escolar</title>
</head>
<body>

<h1>Sistema Escolar</h1>

<h2>Cadastrar Aluno</h2>

<input id="nome" placeholder="Nome">

<input id="nascimento" type="date">

<input id="turma" placeholder="Turma">

<button onclick="cadastrarAluno()">
Salvar
</button>

<hr>

<button onclick="listarAlunos()">
Listar Alunos
</button>

<div id="resultado"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyqaEihJEYjEcdAs0_Rvxa5tJwDhm3NdeJ6goDvmbdR-ny6UaurPk03M8jSFfb8_JXP7A/exec";

async function cadastrarAluno(){

const nome =
document.getElementById("nome").value;

const nascimento =
document.getElementById("nascimento").value;

const turma =
document.getElementById("turma").value;

await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

acao:"cadastrarAluno",
nome,
nascimento,
turma

})

});

alert("Aluno cadastrado");

}

async function listarAlunos(){

const resposta = await fetch(API_URL,{

method:"POST",

body:JSON.stringify({
acao:"listarAlunos"
})

});

const dados = await resposta.json();

let html = "<table border='1'>";

dados.alunos.forEach(linha=>{

html += "<tr>";

linha.forEach(coluna=>{

html += `<td>${coluna}</td>`;

});

html += "</tr>";

});

html += "</table>";

document.getElementById("resultado").innerHTML =
html;

}

</script>

</body>
</html>
